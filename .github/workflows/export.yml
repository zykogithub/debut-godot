name: "godot-deploy"
on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1
  EXPORT_NAME: debut
  PROJECT_PATH: .

jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-24.04 
    container:
      image: zykodocker25/godot-image:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Windows Desktop" "$EXPORT_DIR/windows/$EXPORT_NAME.exe"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows

  export-linux:
    name: Linux Export
    runs-on: ubuntu-24.04 
    container:
      image: zykodocker25/godot-image:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Linux Build
        run: |
          mkdir -v -p build/linux
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Linux" "$EXPORT_DIR/linux/$EXPORT_NAME.x86_64"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux
  deploy:
    name: Deploy with Butler
    runs-on: ubuntu-24.04
    needs: [export-windows, export-linux]
    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: build/windows

      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: build/linux
      - name: Deploy with Butler
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          USERNAME: ${{secrets.ITCHIO_USERNAME}}
          GAME: ${{secrets.ITCHIO_GAME}}
        run: |
          echo "$BUTLER_CREDENTIALS" | butler login --credentials-file=-
          butler push build/windows/${EXPORT_NAME}.exe ${USERNAME}/${GAME}:windows --userversion=$(date +%Y.%m.%d)
          butler push build/linux/${EXPORT_NAME}.x86_64 ${USERNAME}/${GAME}:linux --userversion=$(date +%Y.%m.%d)